name: Atualizar Catalogo de IA & Open Source

on:
  schedule:
    # Executa todo domingo às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite disparo manual com 1 clique no GitHub

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Atualização com NVIDIA Llama 3.1 & GitHub API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_hunter.py

      - name: Commit e Push das Atualizações
        run: |
          git config --global user.name "OpenSource Hunter Bot"
          git config --global user.email "bot@opensourcehunter.rodrigoborin.com"
          git add tools.json index.html
          if git diff --staged --quiet; then
            echo "Nenhuma nova ferramenta adicionada nesta rodada."
          else
            git commit -m "🤖 Auto-Update: Novas ferramentas de IA catalogadas via NVIDIA Llama 3.1 [skip ci]"
            git push origin main
          fi
